version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safeout
      POSTGRES_PASSWORD: safeout
      POSTGRES_DB: safeout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    build: .
    command: python main.py
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: celery -A core.tasks.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.routes:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
